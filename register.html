
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Create your Ran Digital LP Community account.">

  <title>Create Account | RND LP</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-body">

  <main class="auth-shell">

    <a class="brand" href="index.html">
      <span class="brand-mark">R</span>
      <span>RAN<span class="brand-light">DIGITAL</span></span>
    </a>

    <section class="auth-card">

      <p class="eyebrow">JOIN THE COMMUNITY</p>

      <h1>Create account</h1>

      <p class="muted">
        Create your secure RND LP account.
        Email verification is required before submitting LP proof.
      </p>

      <form id="registerForm">

        <label for="fullName">
          Full name
          <input
            id="fullName"
            type="text"
            autocomplete="name"
            maxlength="70"
            required
          >
        </label>

        <label for="email">
          Email address
          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          >
        </label>

        <label for="password">
          Password
          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="12"
            required
          >
          <small>
            Minimum 12 characters with uppercase,
            lowercase, number and symbol.
          </small>
        </label>

        <label for="confirmPassword">
          Confirm password
          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="12"
            required
          >
        </label>

        <button
          class="button button-primary full"
          type="submit"
        >
          Create account
        </button>

      </form>

      <p
        class="auth-message"
        id="message"
        role="status"
        aria-live="polite"
      ></p>

      <p class="auth-switch">
        Already registered?
        <a href="login.html">Login</a>
      </p>

      <a class="back-link" href="index.html">
        ← Back to website
      </a>

    </section>

  </main>

  <script type="module" src="register.js"></script>

</body>
</html>
